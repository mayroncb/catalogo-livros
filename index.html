<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minha Estante — Catálogo de Livros</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-mode="public">
  <header class="topbar">
    <div class="container topbar-inner">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">📚</span>
        <div>
          <h1>Minha Estante</h1>
          <p class="subtitle" id="stats-summary">0 títulos · 0 disponíveis</p>
        </div>
      </div>

      <div class="topbar-actions">
        <span class="public-badge" id="public-sync-badge">Catálogo para consulta</span>
      </div>
    </div>
  </header>

  <main class="container main-content">
    <section class="toolbar" aria-label="Filtros e visualização">
      <div class="search-box">
        <input
          type="search"
          id="search-input"
          placeholder="Buscar por título, autor ou ISBN..."
          autocomplete="off"
        />
      </div>

      <div class="toolbar-controls">
        <select id="filter-status" aria-label="Filtrar por disponibilidade">
          <option value="all">Todos</option>
          <option value="available" selected>Disponíveis</option>
          <option value="sold">Esgotados (0)</option>
        </select>

        <div class="view-toggle" role="group" aria-label="Modo de visualização">
          <button type="button" class="btn-toggle active" id="view-grid" title="Visualização em Capas">
            Capas
          </button>
          <button type="button" class="btn-toggle" id="view-list" title="Visualização em Lista">
            Lista
          </button>
        </div>
      </div>
    </section>

    <section id="catalog-container" class="catalog-grid" aria-live="polite"></section>

    <div id="empty-state" class="empty-state hidden">
      <p class="empty-title">Nenhum livro disponível no momento</p>
      <p class="empty-desc">Tente ajustar a busca ou o filtro acima.</p>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
